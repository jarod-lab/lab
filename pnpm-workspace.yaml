catalog:
  "@better-auth/oauth-provider": "1.7.7"
  "@better-auth/passkey": "1.7.7"
  "@better-auth/sso": "1.7.7"
  "@better-auth/stripe": "1.7.7"
  "@gdp-ts/core": "^0.1.0"
  "@modelcontextprotocol/sdk": "^1.32.1"
  "@shadcn/lint": "^0.2.0"
  "@tailwindcss/vite": "^4.3.3"
  "@types/node": "^24.19.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitest/coverage-v8": "^5.0.3"
  "better-auth": "1.7.7"
  "cn": "^0.4.0"
  "drizzle-orm": "^0.45.3"
  "jose": "^6.2.12"
  "jsdom": "^30.1.2"
  "oxlint": "^1.87.0"
  "react": "^19.3.0"
  "react-dom": "^19.3.0"
  "tailwindcss": "^4.3.3"
  "typescript": "^5.9.3"
  "vite": "^8.3.2"
  "vitest": "^5.0.3"
  "zod": "^4.6.5"

packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAgeExclude:
  - '@gdp-ts/core@0.1.0'
  - '@oxlint/binding-android-arm-eabi@1.87.0'
  - '@oxlint/binding-android-arm64@1.87.0'
  - '@oxlint/binding-darwin-arm64@1.87.0'
  - '@oxlint/binding-darwin-x64@1.87.0'
  - '@oxlint/binding-freebsd-x64@1.87.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.87.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.87.0'
  - '@oxlint/binding-linux-arm64-gnu@1.87.0'
  - '@oxlint/binding-linux-arm64-musl@1.87.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.87.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.87.0'
  - '@oxlint/binding-linux-riscv64-musl@1.87.0'
  - '@oxlint/binding-linux-s390x-gnu@1.87.0'
  - '@oxlint/binding-linux-x64-gnu@1.87.0'
  - '@oxlint/binding-linux-x64-musl@1.87.0'
  - '@oxlint/binding-openharmony-arm64@1.87.0'
  - '@oxlint/binding-win32-arm64-msvc@1.87.0'
  - '@oxlint/binding-win32-ia32-msvc@1.87.0'
  - '@oxlint/binding-win32-x64-msvc@1.87.0'
  - oxlint@1.87.0
  - better-inbox@0.5.0
  - '@wraps.dev/better-auth@0.4.0'

allowBuilds:
  esbuild: true
  lefthook: true

# Advisories `pnpm audit` (CI's audit job) skips. Each needs a reason; remove it once a fix lands.
auditConfig:
  ignoreGhsas:
    # esbuild's dev server (GHSA-67mh-4wv8-2f99): dev-only, through drizzle-kit's @esbuild-kit; we
    # never run esbuild's server. The Dependabot alert is dismissed too (docs/tooling.md).
    - GHSA-67mh-4wv8-2f99
    # braces stack exhaustion (GHSA-vfj7-8cjw-p6xm): through the shadcn CLI's fast-glob, dev-time
    # only. No patched braces (>=3.0.4) is published yet; drop this when one is.
    - GHSA-vfj7-8cjw-p6xm
