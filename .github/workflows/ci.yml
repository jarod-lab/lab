name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Conventional Commit titles, the same types commitlint accepts (AGENTS.md, "Commits").
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # mise-action installs pnpm 11. mise reads .mise.toml without `mise trust` when CI and
      # GITHUB_ACTIONS are set (checked locally with those variables set; a plain run is refused).
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Conventional commits (PR range)
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: gitleaks git --redact --config .gitleaks.toml
      - run: pnpm baseline
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Generated files must match what the generators write now. The vite build above has already
      # rewritten routeTree.gen.ts. The auth schema generator needs no database (auth.cli.ts uses a
      # placeholder). The formatter runs over the output first, so only content drift fails.
      - name: Generated files are current
        run: |
          pnpm --filter @starter/sdk generate
          pnpm --filter @starter/auth generate
          pnpm stories
          pnpm biome format --write packages/db/src/auth-schema.ts packages/ui/src/components
          git diff --exit-code -- apps/web/src/routeTree.gen.ts packages/db/src/auth-schema.ts packages/sdk/src/schema.gen.ts packages/ui/src/components
          test -z "$(git ls-files --others --exclude-standard -- packages/ui/src/components)"
      - run: pnpm test:coverage
      - run: pnpm format:check

  openapi:
    name: OpenAPI breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Extract the base contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:apps/api/openapi.json" 2>/dev/null; then
            git show "$BASE_SHA:apps/api/openapi.json" > base-openapi.json
          else
            echo "::notice::apps/api/openapi.json is not on the base branch; nothing to compare"
          fi
      # review: false keeps both specs inside CI; the action otherwise uploads them to oasdiff.com.
      - name: Fail on breaking changes
        if: hashFiles('base-openapi.json') != ''
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: base-openapi.json
          revision: apps/api/openapi.json
          fail-on: ERR
          review: "false"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
