[baseline]
name = "starter"
extends = ["shadcn-strict", "dependency-hygiene", "security"]
# scripts: CLIs may log. *-example.tsx: shadcn demo code, full of raw colors by design.
exclude = ["scripts/**", "packages/ui/src/components/*-example.tsx"]

# Overrides the shadcn-strict rule of the same id (presets are replaced whole): identical except
# the overlay scrim used by shadcn's dialog, alert-dialog, sheet and drawer (Sera), which is
# intentionally the same in both themes.
[[rule]]
id = "enforce-dark-mode"
type = "tailwind-dark-mode"
severity = "error"
glob = "**/*.{tsx,jsx}"
message = "Missing dark: variant for color class"
suggest = "Use a shadcn semantic token class or add an explicit dark: counterpart"
allowed_classes = ["bg-black/20"]
