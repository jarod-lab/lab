catalog:
  "@better-auth/cimd": "1.7.7"
  "@better-auth/oauth-provider": "1.7.7"
  "@better-auth/passkey": "1.7.7"
  "@better-auth/sso": "1.7.7"
  "@better-auth/stripe": "1.7.7"
  "@gdp-ts/core": "^0.1.0"
  "@modelcontextprotocol/sdk": "^1.32.1"
  "@shadcn/lint": "^0.2.0"
  "@tailwindcss/vite": "^4.3.3"
  "@tanstack/eslint-plugin-query": "^5.104.3"
  "@tanstack/eslint-plugin-router": "^1.162.0"
  "@types/node": "^24.19.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitest/coverage-v8": "^5.0.3"
  "better-auth": "1.7.7"
  "cn": "^0.4.0"
  "drizzle-orm": "^0.45.3"
  "jose": "^6.2.12"
  "jsdom": "^30.1.2"
  "oxlint": "^1.87.0"
  "react": "^19.3.0"
  "react-dom": "^19.3.0"
  "tailwindcss": "^4.3.3"
  "typescript": "^7.0.2"
  "vite": "^8.3.5"
  "vitest": "^5.0.3"
  "zod": "^4.6.5"

packages:
  - "apps/*"
  - "packages/*"

# Transitive packages pinned below their fixed release by a dependency that has not moved yet. Each
# is a minor or patch of the version it replaces; drop the entry once its parent ships the fix.
overrides:
  # e2e (the test runner) pins 2.2.0 (GHSA: shared transport, bearer auth): fixed in 2.3.0.
  "@modelcontextprotocol/server": ">=2.3.0"
  # socks (through the shadcn CLI's registry client) pins 10.7.3: fixed in 10.7.4.
  ip-address: ">=10.7.4"

minimumReleaseAgeExclude:
  - '@byo-oss/*'
  - '@wraps.dev/*'

allowBuilds:
  esbuild: true
  lefthook: true

# Advisories `pnpm audit` (CI's audit job) skips. Each needs a reason; remove it once a fix lands.
auditConfig:
  ignoreGhsas:
    # esbuild's dev server (GHSA-67mh-4wv8-2f99): dev-only, through drizzle-kit's @esbuild-kit; we
    # never run esbuild's server. The Dependabot alert is dismissed too (docs/tooling.md).
    - GHSA-67mh-4wv8-2f99

# `pnpm audit --fix` drops an ignored advisory above once it no longer appears in the report.
audit:
  ignorePrune: true
