pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --config .gitleaks.toml
    baseline:
      run: pnpm baseline
    format:
      # Biome formats JS, TS, JSON and CSS. It does not format Markdown in this version (2.5 reports
      # the formatter disabled for .md), so .md is left out.
      glob: "*.{ts,tsx,js,mjs,json,css}"
      run: pnpm biome format --no-errors-on-unmatched {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
