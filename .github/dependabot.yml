version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # let new releases settle (pnpm also holds back very fresh versions)
    open-pull-requests-limit: 5
    ignore:
      # Keep @types/node on the Node major pinned in .mise.toml.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # better-auth breaks things in minor and patch releases. Its packages are pinned exactly and
      # move together in their own PR, so apps/api/src/auth-flows.test.ts gates them on their own.
      # A dependency joins the first group that matches, so this one must stay above minor-and-patch.
      better-auth:
        patterns: ["better-auth", "@better-auth/*", "auth"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
