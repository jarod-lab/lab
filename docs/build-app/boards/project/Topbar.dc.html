<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<header style="--bg: {{t.bg}}; --ink: {{t.ink}}; --muted: {{t.muted}}; --line: {{t.line}}; --solar: #FFD23F; width: 100%; min-width: 600px; height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.5">
  <nav aria-label="Breadcrumb" style="flex: 1; min-width: 0">
    <ol style="display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; align-items: center; white-space: nowrap; overflow: hidden">
      <sc-for list="{{crumbs}}" as="c" hint-placeholder-count="3">
        <sc-if value="{{c.notFirst}}" hint-placeholder-val="{{ true }}"><li aria-hidden="true" style="color: var(--muted)">/</li></sc-if>
        <sc-if value="{{c.last}}" hint-placeholder-val="{{ false }}"><li aria-current="page" style="font-weight: 650">{{c.label}}</li></sc-if>
        <sc-if value="{{c.notLast}}" hint-placeholder-val="{{ true }}"><li><a href="#" style="color: var(--muted); text-underline-offset: 3px">{{c.label}}</a></li></sc-if>
      </sc-for>
    </ol>
  </nav>
  <button style="min-height: 40px; width: 260px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; text-align: left"><span style="flex: 1">Search or ask an agent</span><span style="display: flex; gap: 3px"><kbd style="min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; display: grid; place-items: center; font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2.5px; border-radius: 5px">⌘</kbd><kbd style="min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; display: grid; place-items: center; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; font-weight: 600; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2.5px; border-radius: 5px">K</kbd></span></button>
  <button aria-label="Inbox, 3 need you" style="position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); font: inherit; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"></path><path d="M5.5 5h13L21 13v6H3v-6z"></path></svg><span aria-hidden="true" style="position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 6px; background: var(--solar); color: #111111; border: 2px solid var(--bg); display: grid; place-items: center; font-size: 11.5px; font-weight: 800">3</span></button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]},"crumbs":{"editor":"text","default":"Acme Inc / Settings / Members"},"$preview":{"width":948,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark ? { bg: '#0A0A0A', ink: '#F5F5F0', muted: '#B3B3AE', line: '#2E2E2B' } : { bg: '#FAFAF7', ink: '#111111', muted: '#555555', line: '#D6D6CF' };
    const parts = String(this.props.crumbs ?? 'Acme Inc / Settings / Members').split('/').map((s) => s.trim()).filter(Boolean);
    const crumbs = parts.map((label, i) => ({ label, last: i === parts.length - 1, notLast: i !== parts.length - 1, notFirst: i > 0 }));
    return { t, crumbs };
  }
}
</script>
</body>
</html>
