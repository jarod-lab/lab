pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --config .gitleaks.toml
    baseline:
      run: pnpm baseline
    format:
      glob: "*.{ts,tsx,json,css}"
      run: pnpm biome format --no-errors-on-unmatched {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
